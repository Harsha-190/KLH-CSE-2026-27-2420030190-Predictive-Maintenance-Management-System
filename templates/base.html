<!DOCTYPE html>

    <title>{% block title %}Predictive Maintenance{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

    <div class="brand">Predictive<span>Maintain</span></div>
